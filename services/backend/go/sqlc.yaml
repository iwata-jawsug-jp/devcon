version: '2'
sql:
  - engine: 'postgresql'
    queries: 'internal/db/queries'
    # Snapshot of the Alembic-owned schema (services/backend/python/alembic) — regenerated by
    # `make gen-schema`, never hand-edited. See proposal §2.3.1 / services/backend/go/CLAUDE.md.
    schema: 'internal/db/schema.sql'
    gen:
      go:
        package: 'sqlcgen'
        out: 'internal/db/sqlcgen'
        sql_package: 'pgx/v5'
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
