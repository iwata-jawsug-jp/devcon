# copier テンプレート設定。
#
# ADR-0010（copier 採用）・ADR-0011（本リポジトリを in-place でテンプレート化）・
# docs/scaffold-cli.md（ハードコード箇所の洗い出し・変数設計・テンプレート化の機構）を参照。
#
# チェックイン済みファイルに `{{ project_name }}` 等の Jinja マーカーを直書きしない。
# ADR-0011 の「本リポジトリ自身が常に動くテンプレートであり続ける」という前提上、
# devcontainer.json の "name" や README の見出しに生の Jinja 構文が入ると、
# devcon 自身を普通に開いたときにそれがそのまま表示されてしまい壊れる。
# 代わりに `tools/script/publish-to-public.sh` と同じ「コピー後に sed で文字列置換する」
# 方式を _tasks で行う。チェックイン済みファイルは一切変更しない。

_exclude:
  # copier の標準除外（`_exclude` を自前定義すると copier のデフォルトは継承されず丸ごと
  # 上書きされる — 明示しないと `.git`（本リポジトリの全コミット履歴）や `copier.yml` 自体が
  # そのまま生成物に複製されてしまう。#515 で実機確認・修正）
  - copier.yaml
  - copier.yml
  - '~*'
  - '*.py[co]'
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  # ==== BEGIN GENERATED: tools/template/audience.yml (generate:false)。手で編集しない。
  #      `make gen-audience-excludes` で再生成する。理由は audience.yml 側に書く。
  #      ADR-0028 D1（#700）。====
  - .github/ISSUE_TEMPLATE/chore.md
  - .github/ISSUE_TEMPLATE/config.yml
  - .github/ISSUE_TEMPLATE/feature-sdd.md
  - .github/ISSUE_TEMPLATE/verification.md
  - .github/dependabot.yml
  - .github/workflows/cd-app-verify.yml
  - .github/workflows/cd-infra-verify.yml
  - .github/workflows/devcontainer-build.yml
  - .github/workflows/publish.yml
  - .github/workflows/reusable-scaffold.yml
  - .kiro/specs/items-add-field
  - CHANGELOG.md
  - docs/adr/0010-adopt-copier-for-scaffold-cli.md
  - docs/adr/0011-scaffold-template-in-place.md
  - docs/adr/0013-decline-aidlc-workflows-adoption.md
  - docs/adr/0016-terraform-bootstrap-module-distributed-in-repo.md
  - docs/adr/0019-policy-as-code-downstream-distribution.md
  - docs/adr/0028-template-and-generated-asset-separation.md
  - docs/frontend-frameworks-demo.md
  - docs/org-rulesets.md
  - docs/proposal
  - docs/release.md
  - docs/scaffold-cli.md
  - infra/env/golden-path-verify.backend.hcl.example
  - infra/env/golden-path-verify.tfvars.example
  - tools/script/check_adr_audience.py
  - tools/script/clean-excluded-doc-references.sh
  - tools/script/gen-audience-excludes.py
  - tools/script/publish-to-public.sh
  - tools/script/strip-audience-blocks.sh
  - tools/script/verify-scaffold.sh
  - tools/template/audience.yml
  # ==== END GENERATED ====

project_name:
  type: str
  help: >-
    プロジェクト名（S3バケット名・ECRリポジトリ名・Cognitoドメインの一部として使われるため、
    小文字英数字とハイフンのみ、3〜63文字）
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]{1,61}[a-z0-9]$')) %}
    project_name は小文字で始まり、小文字英数字とハイフンのみ、3〜63文字にしてください
    {% endif %}

github_org:
  type: str
  help: 'GitHub organization または user 名（infra/bootstrap の OIDC 信頼ポリシーに使う）'
  validator: >-
    {% if not (github_org | regex_search('^[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$')) %}
    github_org は有効な GitHub organization/user 名にしてください
    {% endif %}

github_repo:
  type: str
  help: 'GitHub リポジトリ名（省略時は project_name と同じ）'
  default: '{{ project_name }}'

aws_region:
  type: str
  help: 'デプロイ先の AWS リージョン'
  default: 'ap-northeast-1'
  validator: >-
    {% if not (aws_region | regex_search('^[a-z]{2}-[a-z]+-\d$')) %}
    aws_region は ap-northeast-1 のような AWS リージョン形式にしてください
    {% endif %}

# publish-to-public.sh の EXCLUDES 適用後の置換ロジック（SRC_REPO_PATH → DEV_NAME の順）と
# 同じ順序: より具体的な文字列（org/repo パス）を先に置換してから、単独のプロジェクト名を
# 置換する。テキストファイルのみ対象（grep -Iq でバイナリを除外）。
#
# `devcon` パターンだけ \b で単語境界を要求する: 公開ミラー（iwata-jawsug-jp/devcon）
# 経由でこの copier.yml が使われるとき、publish-to-public.sh 自身の変換で `devcon` は
# 短い `devcon` に化ける。`devcon` は `.devcontainer/devcontainer.json` 等の
# `devcontainer` という頻出語の先頭一致になってしまうため、単語境界なしだと
# `ghcr.io/devcontainers/...` のような文字列を破壊する（#515 で実機確認）。
#
# `\b` は GNU sed の実行時ロケールに依存する: UTF-8 ロケール（en_US.UTF-8 等、Linux/macOS
# の一般的な既定値）では CJK（漢字・かな）を alnum 相当とみなすため、"devcon" の直後に
# 空白なしで日本語が続く箇所（Markdown/コメントの地の文で起こりうる。例:
# "devcon自身"）で単語境界の判定に失敗し、置換が黙って効かない（実機検証で再現・
# インターネット検索で既知の class of bug と確認: GNU grep/sed の `\b`/`-w` は locale の
# ctype テーブルに従って word-constituent を判定するため、UTF-8 ロケールではマルチバイト
# 文字が巻き込まれる）。C/POSIX ロケールでは非ASCIIバイトはすべて非word文字として扱われ
# 期待どおり動くため、`LC_ALL=C` で明示的にバイト単位の判定に固定する（単純なリテラル
# 文字列の置換なので、多バイト文字を「1文字」として解釈できなくても対象データは破壊されない）。
# 検証手順・再現コマンドは docs/scaffold-cli.md 参照。他の3パターンは
# 衝突がなく、\b を付けると逆に `ap-northeast-1_xxxxxxxxx`（CognitoユーザープールID）のような
# 後続がアンダースコアの正当な一致を壊すため、意図的に付けない。
#
# `.copier-answers.yml`（`.copier-answers.yml.jinja` から copier が自動生成）はこのループから
# 除外する: `_src_path` は `copier update` が参照する本物のテンプレート配布元（例:
# `gh:iwata-jawsug-jp/devcon`）を指しており、他ファイルと同じ置換をかけると `devcon` /
# `itouhi` を含む正当な値まで書き換わって `copier update` が別のリポジトリを指してしまう
# （#298 で実機確認・修正）。この置換ループが救っているのはチェックイン済みファイル側の
# 直書き文字列だけであり、`.copier-answers.yml` の各値は copier 自身が生成時点の回答で
# 正しくレンダリング済みのため、そもそも置換の必要がない。
#
# マーカー（`audience:no-generate` / `audience:no-publish`）で囲んだブロックの除去
# （ADR-0028 D2、#702）: ファイル単位では切れない記述（1ファイル中の一部だけを生成先に
# 出さない・公開しない）を、公開導線（publish-to-public.sh の 2a）と同じ実装
# （tools/script/strip-audience-blocks.sh）で除去する。このスクリプト自体は generate:false
# （tools/template/audience.yml）で生成先にはコピーされないが、`_copier_conf.src_path` は
# copier が内部で使うテンプレート取得元（ローカル clone）の絶対パスを指しており、_exclude の
# 対象でも常に存在する（_exclude はコピー先への複製だけを止める設定で、テンプレート取得元
# 自体には影響しない）ため、生成先に配布せずに呼び出せる。audience:no-publish も併せて除去
# するのは、生成が公開用ツリーだけでなく開発用ツリーを起点にも行われうるため（両者に対する
# 実測は ADR-0028 Context）——公開しないブロックは、公開用ツリーを経由しない生成でも
# 同じく生成先に出てはならない。
# 除外先ドキュメントへの参照の掃除（ADR-0028 D2、#703）: 上記マーカー除去と同じ理由で
# tools/script/clean-excluded-doc-references.sh を `_copier_conf.src_path` 経由で呼ぶ
# （このスクリプトも generate:false）。渡す対象パス（フラグメント）は
# tools/template/audience.yml の generate:false エントリから
# tools/script/gen-audience-excludes.py が導出し、下の GENERATED ブロックへ書き出す
# （`release.md`/`proposal/` のハードコードをやめ、マニフェストを単一の正にする）。
_tasks:
  - >-
    find . -path ./.git -prune -o -type f -print0 | xargs -0
    bash "{{ _copier_conf.src_path }}/tools/script/strip-audience-blocks.sh" no-generate
  - >-
    find . -path ./.git -prune -o -type f -print0 | xargs -0
    bash "{{ _copier_conf.src_path }}/tools/script/strip-audience-blocks.sh" no-publish
  # ==== BEGIN GENERATED: tools/template/audience.yml (generate:false, 参照掃除)。
  #      手で編集しない。`make gen-audience-excludes` で再生成する。理由は audience.yml
  #      側に書く。ADR-0028 D2（#703）。====
  - >-
    find . -path ./.git -prune -o -type f -name '*.md' -print0 | xargs -0
    bash "{{ _copier_conf.src_path }}/tools/script/clean-excluded-doc-references.sh"
    '0010-adopt-copier-for-scaffold-cli\.md' '0011-scaffold-template-in-place\.md' '0013-decline-aidlc-workflows-adoption\.md' '0016-terraform-bootstrap-module-distributed-in-repo\.md' '0019-policy-as-code-downstream-distribution\.md' '0028-template-and-generated-asset-separation\.md' 'CHANGELOG\.md' 'audience\.yml'
    'cd-app-verify\.yml' 'cd-infra-verify\.yml' 'check_adr_audience\.py' 'chore\.md' 'clean-excluded-doc-references\.sh' 'config\.yml' 'dependabot\.yml' 'devcontainer-build\.yml'
    'feature-sdd\.md' 'frontend-frameworks-demo\.md' 'gen-audience-excludes\.py' 'golden-path-verify\.backend\.hcl\.example' 'golden-path-verify\.tfvars\.example' 'items-add-field\/[^()]*' 'org-rulesets\.md' 'proposal\/[^()]*'
    'publish-to-public\.sh' 'publish\.yml' 'release\.md' 'reusable-scaffold\.yml' 'scaffold-cli\.md' 'strip-audience-blocks\.sh' 'verification\.md' 'verify-scaffold\.sh'
    --
  # ==== END GENERATED ====
  - >-
    find . -path ./.git -prune -o -name .copier-answers.yml -prune -o -type f -print0 | xargs -0
    grep -Il . 2>/dev/null | while IFS= read -r f; do
    LC_ALL=C sed -i
    -e 's#iwata-jawsug-jp/devcon#{{ github_org }}/{{ github_repo }}#g'
    -e 's#itouhi#{{ github_org }}#g'
    -e 's#\bdevcon\b#{{ project_name }}#g'
    -e 's#ap-northeast-1#{{ aws_region }}#g'
    "$f"; done
