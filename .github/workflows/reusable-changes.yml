name: reusable-changes

# ADR-0012 / #295: ci.yml と ci-sandbox.yml が共有する per-area 品質ゲート。この workflow は
# 「何が変わったか」の判定のみを担う（実行するかどうかの判断は呼び出し側に残す）。
# ワークフローファイル自体の変更は area を問わず保守的に「変わった」扱いにする
# （.github/workflows/** を全 area 共通のトリガーに含める）。

on:
  workflow_call:
    outputs:
      backend:
        value: ${{ jobs.check.outputs.backend }}
      backend_go:
        value: ${{ jobs.check.outputs.backend_go }}
      frontend:
        value: ${{ jobs.check.outputs.frontend }}
      infra:
        value: ${{ jobs.check.outputs.infra }}
      scripts:
        value: ${{ jobs.check.outputs.scripts }}
      # audience:no-generate — 課題A（#702）: scaffold ジョブ自体が生成先に出ないため不要。
      scaffold:
        value: ${{ jobs.check.outputs.scaffold }}
      # /audience:no-generate

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter reads PR changed files via the GitHub API

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_go: ${{ steps.filter.outputs.backend_go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      scripts: ${{ steps.filter.outputs.scripts }}
      # audience:no-generate
      scaffold: ${{ steps.filter.outputs.scaffold }}
      # /audience:no-generate
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'services/backend/python/**'
              - '.github/workflows/**'
            backend_go:
              - 'services/backend/go/**'
              - '.github/workflows/**'
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'
              # Root-level tool config the infra job's steps consume directly (#511
              # discovered this gap: a .tflint.hcl-only change didn't trigger `infra`,
              # so its own fix couldn't be verified by CI).
              - '.tflint.hcl'
              - '.trivyignore'
            scripts:
              - '.github/scripts/**'
              - '.github/workflows/**'
              # check_oauth_scopes.py (#438) cross-checks these two files against each
              # other, so the job must also trigger when only one of them changes.
              - 'infra/auth.tf'
              - 'services/frontend/src/auth/oidcConfig.ts'
            # audience:no-generate — 課題A（#702）: scaffold ジョブ自体が生成先に出ないため
            # この filter カテゴリも不要。
            scaffold:
              - 'copier.yml'
              - 'tools/script/verify-scaffold.sh'
              # #700: gen-audience-excludes.py の --check がこのジョブに乗っている
              # （reusable-scaffold.yml）ため、その入力（マニフェスト自体・スクリプト本体・
              # 生成対象のもう一方のファイル）が変わった回も確実に scaffold ジョブが走るようにする。
              - 'tools/template/audience.yml'
              - 'tools/script/gen-audience-excludes.py'
              - 'tools/script/publish-to-public.sh'
              - '.github/workflows/**'
            # /audience:no-generate
