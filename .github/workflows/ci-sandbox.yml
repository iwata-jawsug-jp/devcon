name: CI (sandbox)

# Sandbox CI: mirror of ci.yml's per-service gates, run on push to sandbox/** unconditionally
# (no path filter, to avoid new-branch diff edge cases). Lets you validate changes on a sandbox
# branch before exercising the sandbox CD apply. Excluded from the public mirror (see release.md).
#
# Shares the same reusable-*.yml job definitions as ci.yml (ADR-0012 / #295) so the two
# workflows can no longer drift the way they had (#153 finding 7). Deliberately does NOT call
# reusable-changes.yml — this file's whole point is to run every area unconditionally, so it
# calls each reusable-<area>.yml directly instead of gating on path-filter output.
#
# backend-go, scaffold, and tree-health are the exceptions: they still respect
# BACKEND_GO_ENABLED / SCAFFOLD_ENABLED / TREE_HEALTH_ENABLED (docs/ci-cd-area-switches.md).
# Unlike the other jobs here, these aren't path-filter skips; they're the same dedicated
# switches ci.yml uses (backend-go opt-in/default disabled, scaffold and tree-health
# opt-out/default enabled), so sandbox branches respect the same on/off state. tree-health
# never depended on path-filter output in ci.yml to begin with (#699 — it can't, since a broken
# link is caused by the file that *disappeared*, not one that changed), so it behaves
# identically here and in ci.yml.
on:
  push:
    branches: [sandbox/**]

permissions:
  contents: read

concurrency:
  group: ci-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/reusable-backend.yml

  backend-go:
    uses: ./.github/workflows/reusable-backend-go.yml
    with:
      should_run: ${{ vars.BACKEND_GO_ENABLED == 'true' }}

  frontend:
    uses: ./.github/workflows/reusable-frontend.yml

  gen-types:
    uses: ./.github/workflows/reusable-gen-types.yml

  infra:
    uses: ./.github/workflows/reusable-infra.yml

  scripts:
    uses: ./.github/workflows/reusable-scripts.yml

  # audience:no-generate
  # 課題A（#702）: 生成先には検証対象の copier.yml が無く必ず失敗する
  # （reusable-scaffold.yml は generate:false、tools/template/audience.yml）。
  scaffold:
    uses: ./.github/workflows/reusable-scaffold.yml
    with:
      should_run: ${{ vars.SCAFFOLD_ENABLED != 'false' }}
  # /audience:no-generate

  # #699: TREE_HEALTH_ENABLED も scaffold と同じ扱いで sandbox でも尊重する（この変数は元々
  # 変更検知でゲートしない設計なので、ci.yml との差はここでも無い）。
  tree-health:
    uses: ./.github/workflows/reusable-tree-health.yml
    with:
      should_run: ${{ vars.TREE_HEALTH_ENABLED != 'false' }}
