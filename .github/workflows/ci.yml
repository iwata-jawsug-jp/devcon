name: CI

# Mirrors the Makefile / pre-commit gates so "green locally" == "green in CI". Per-area gate
# logic lives in reusable-*.yml (workflow_call, ADR-0012 / #295) so this file, ci-sandbox.yml,
# and downstream consumers all share a single source instead of copy-drifting (#153 finding 7).
#
# NOTE: calling a job via `uses:` changes its status-check context name to
# "<this job's name> / check" (verified empirically — see ADR-0012). Each area job below is
# ALWAYS invoked (no `if:` on the caller side); the skip decision is passed in as the
# `should_run` input instead, so the reported check name stays "<area> / check" whether the
# job actually runs or is skipped internally. Gating with `if:` here would instead make GitHub
# report the bare "<area>" (no " / check" suffix) when skipped — a different context string
# that the main-ci-required ruleset would never see, permanently blocking merges for any PR
# where that area is legitimately skipped (discovered the hard way while rolling this out).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter reads PR changed files via the GitHub API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so per-service jobs only run when relevant.
  changes:
    uses: ./.github/workflows/reusable-changes.yml

  # Per-area kill switches: repository variables BACKEND_ENABLED / FRONTEND_ENABLED /
  # INFRA_ENABLED gate both CI and CD jobs for that area. Compared with `!= 'false'` so an
  # unset variable (e.g. on the public mirror / forks) defaults to enabled. BACKEND_GO_ENABLED
  # below is the odd one out — opt-in, default disabled (docs/ci-cd-area-switches.md).
  backend:
    needs: changes
    uses: ./.github/workflows/reusable-backend.yml
    with:
      should_run: ${{ needs.changes.outputs.backend == 'true' && vars.BACKEND_ENABLED != 'false' }}

  # services/backend/go (Lambda-only, ADR-0024) — separate switch from BACKEND_ENABLED
  # (the Python backend) since the two are independent services with independent CI cost.
  # Opt-in, not opt-out like the other area switches: default disabled, enable explicitly with
  # `gh variable set BACKEND_GO_ENABLED --body true` per docs/ci-cd-area-switches.md.
  backend-go:
    needs: changes
    uses: ./.github/workflows/reusable-backend-go.yml
    with:
      should_run: ${{ needs.changes.outputs.backend_go == 'true' && vars.BACKEND_GO_ENABLED == 'true' }}

  frontend:
    needs: changes
    uses: ./.github/workflows/reusable-frontend.yml
    with:
      should_run: ${{ needs.changes.outputs.frontend == 'true' && vars.FRONTEND_ENABLED != 'false' }}

  # #638: `make gen-types` merges Python + Go OpenAPI into the frontend's generated types.
  # Cross-cutting (any of the three areas can cause drift), so — like scripts/scaffold below —
  # it has no dedicated area switch; it runs whenever backend, backend-go, or frontend changed.
  gen-types:
    needs: changes
    uses: ./.github/workflows/reusable-gen-types.yml
    with:
      should_run: >-
        ${{ needs.changes.outputs.backend == 'true' ||
            needs.changes.outputs.backend_go == 'true' ||
            needs.changes.outputs.frontend == 'true' }}

  infra:
    needs: changes
    uses: ./.github/workflows/reusable-infra.yml
    with:
      should_run: ${{ needs.changes.outputs.infra == 'true' && vars.INFRA_ENABLED != 'false' }}

  scripts:
    needs: changes
    uses: ./.github/workflows/reusable-scripts.yml
    with:
      should_run: ${{ needs.changes.outputs.scripts == 'true' }}

  # audience:no-generate
  # 課題A（#702）: 生成先には検証対象の copier.yml 自体が無く、この
  # ジョブは必ず exit 1 になる（reusable-scaffold.yml は generate:false、tools/template/audience.yml）。
  # #294: copier.yml から実際に生成し、生成物が壊れていないことを検証する（置換漏れ・
  # terraform validate・backend lint・frontend lint/test）。backend/frontend/infra のような
  # エリア別スイッチは持たないが（どのエリア変更でも対象になりうる横断ジョブ）、専用の
  # SCAFFOLD_ENABLED を持つ（他のエリア別スイッチと同じ極性: `!= 'false'`、未設定なら有効。
  # docs/ci-cd-area-switches.md 参照）。
  scaffold:
    needs: changes
    uses: ./.github/workflows/reusable-scaffold.yml
    with:
      should_run: ${{ needs.changes.outputs.scaffold == 'true' && vars.SCAFFOLD_ENABLED != 'false' }}
  # /audience:no-generate

  # #699（ADR-0028 実装フェーズ①）: 開発用ツリー・公開用ツリー・その2つを起点に copier 生成した
  # 生成先ツリー、計4本のリンク切れを検査する横断ジョブ（Epic #698 完了により blocking）。他のエリア別ジョブや
  # scaffold と違い、`needs.changes.outputs.*` の変更検知では**ゲートしない**——リンク切れは
  # 「変更されたファイル」ではなく「削除・リネームされた参照先ファイル」でも起きるため、
  # path-filter方式だと索引ファイル（例: docs/README.md）自体が変更されない回で見逃す。
  # 専用の TREE_HEALTH_ENABLED を持つ（他のエリア別スイッチと同じ極性: `!= 'false'`、未設定なら
  # 有効。docs/ci-cd-area-switches.md 参照）。`needs: changes` 自体は依存関係として残すが、
  # `should_run` の式には使わず毎回フルセットを実行する。
  tree-health:
    needs: changes
    uses: ./.github/workflows/reusable-tree-health.yml
    with:
      should_run: ${{ vars.TREE_HEALTH_ENABLED != 'false' }}
